version: '3.8'

services:
  database:
    container_name: database
    image: postgres:16.4
    restart: always
    user: root
    ports:
      - 9742:5432
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data

  manager:
    container_name: manager
    build: ./GO-Manager
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - MANAGER_HOST=${MANAGER_HOST}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - database
      
volumes:
  pgdata:
